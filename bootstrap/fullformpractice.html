<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <h1 class="text-center">Student Registration Form</h1>
    <div class="container">
       <form>
           <div class="mb-2">
             <label class="form-label">Name:</label>
             <input type="text" class="form-control" placeholder="Enter your name">
           </div>

           <div class="mb-2">
             <label class="form-label">Email:</label>
             <input type="email" class="form-control" placeholder="Enter your email">
           </div>
            
           <div class="mb-2">
             <label class="form-label">Password:</label>
             <input type="password" class="form-control" placeholder="Enter your password">
           </div>

            <div class="mb-2">
             <label class="form-label">Date of Birth:</label>
             <input type="date" class="form-control" placeholder="Enter your date of birth">
           </div>

            <div class="mb-3">
             <label class="form-label">Phone Number:</label>
             <input type="tel" class="form-control" placeholder="Enter your phonenumber">
           </div>


            <div class="mb-3">
                <label class="form-label">Department:</label>
                <select class="form-select">
                    <option>CSE</option>
                    <option>EEE</option>
                    <option>BBA</option>
                    <option>English</option>
                </select>
            </div>


            <div class="mb-3">
                <label class="form-label">Gender:</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender">
                    <label class="form-check-label">Male</label>
                 </div>

                 <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender">
                    <label class="form-check-label">Female</label>
                 </div>

                 <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender">
                    <label class="form-check-label">Others</label>
                 </div>
            
            </div>


            <div class="mb-3">
                <label class="form-label">Skills:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" >
                    <label class="form-check-label">HTML</label>
                 </div>

                 <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">CSS</label>
                 </div>

                 <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">Javascript</label>
                 </div>
            
            </div>



            <div class="mb-2">
             <label class="form-label">Address:</label>
             <input type="textarea" class="form-control" placeholder="Enter your address">
           </div>

           <button class="btn btn-primary">Login</button>


        </form>
    </div>
    
</body>
</html>
