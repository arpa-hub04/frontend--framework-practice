function square(number){
    return number*number;
}

console.log(square(5));
console.log(square(10));

function checkpositive(num){
    if(num>0){
        console.log("Positive");
    }
    else if(num<0){
        console.log("Negative");
    }
    else{
        console.log("Zero");
    }
}
checkpositive(20);
